<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SafeFlow - Venue Safety Operations Platform</title>
<meta name="description" content="SafeFlow is a professional safety, incident, alert, and operations platform for high-density venues."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f4f7fb;
  --bg2:#eef3f8;
  --surface:#ffffff;
  --surface2:#f9fbfd;
  --surface3:#edf2f7;
  --border:#dbe3ec;
  --border2:#c5d0dc;
  --text:#121820;
  --muted:#5d6a78;
  --subtle:#8b98a7;
  --brand:#0f766e;
  --brand2:#134e4a;
  --blue:#2563eb;
  --green:#15803d;
  --amber:#b45309;
  --red:#dc2626;
  --violet:#6d28d9;
  --shadow:0 14px 36px rgba(18,24,32,.08);
  --shadow2:0 6px 16px rgba(18,24,32,.07);
  --focus:0 0 0 3px rgba(15,118,110,.18);
  --font:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
[data-mode="dark"]{
  --bg:#0b0d0f;
  --bg2:#111417;
  --surface:#15191d;
  --surface2:#1b2025;
  --surface3:#242a30;
  --border:#303840;
  --border2:#44505c;
  --text:#f5f7fa;
  --muted:#aeb8c3;
  --subtle:#788491;
  --brand:#2dd4bf;
  --brand2:#99f6e4;
  --blue:#60a5fa;
  --green:#4ade80;
  --amber:#f59e0b;
  --red:#f87171;
  --violet:#a78bfa;
  --shadow:0 18px 44px rgba(0,0,0,.36);
  --shadow2:0 10px 22px rgba(0,0,0,.28);
  --focus:0 0 0 3px rgba(45,212,191,.20);
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
input,select,textarea{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:11px 12px;outline:none;transition:border .16s ease,box-shadow .16s ease,background .16s ease}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:var(--focus)}
textarea{min-height:96px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
a{color:var(--brand);text-decoration:none}
.app{min-height:100vh}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.icon-lg{width:22px;height:22px}
.muted{color:var(--muted)}
.subtle{color:var(--subtle)}
.strong{font-weight:800}
.mono{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:10px 14px;border-radius:8px;border:1px solid transparent;font-weight:700;font-size:13px;line-height:1;white-space:nowrap;transition:background .16s ease,border .16s ease,color .16s ease,transform .16s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--brand);color:#fff}
[data-mode="dark"] .btn-primary{color:#07110f}
.btn-ghost{background:var(--surface2);border-color:var(--border);color:var(--text)}
.btn-outline{border-color:var(--border2);background:transparent;color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.btn-warning{background:var(--amber);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-sm{min-height:32px;padding:7px 10px;font-size:12px}
.btn-full{width:100%}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.86);border-bottom:1px solid var(--border);backdrop-filter:blur(18px)}
[data-mode="dark"] .topbar{background:rgba(11,13,15,.88)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;min-width:0}
.brand-mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--blue));color:#fff;display:grid;place-items:center;box-shadow:var(--shadow2)}
.brand-title{display:flex;flex-direction:column;line-height:1.05}
.brand-title span:first-child{font-size:16px}
.brand-title span:last-child{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.landing{min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2));display:flex;flex-direction:column}
.landing-main{width:100%;max-width:1180px;margin:0 auto;padding:44px 24px 56px;display:grid;grid-template-columns:1.03fr .97fr;gap:30px;align-items:start}
.hero h1{font-size:44px;line-height:1.04;margin:0 0 15px;font-weight:800;letter-spacing:0}
.hero p{font-size:16px;line-height:1.7;color:var(--muted);max-width:650px;margin:0 0 24px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.proof-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.proof{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:15px;box-shadow:var(--shadow2)}
.proof .value{font-size:22px;font-weight:800;margin-bottom:4px}
.proof .label{font-size:12px;color:var(--muted);font-weight:700}
.ops-board{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.ops-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.ops-title{font-weight:800}
.ops-body{padding:18px;display:grid;gap:14px}
.venue-map{position:relative;min-height:270px;border:1px solid var(--border);border-radius:8px;background:linear-gradient(135deg,var(--surface2),var(--surface3));overflow:hidden}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:34px 34px;opacity:.48}
.zone-node{position:absolute;border:1px solid var(--border2);background:var(--surface);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow2);min-width:112px}
.zone-node .zn-title{font-size:12px;font-weight:800;margin-bottom:4px}
.zone-node .zn-meta{font-size:11px;color:var(--muted)}
.node-high{border-color:rgba(220,38,38,.5)}
.node-watch{border-color:rgba(180,83,9,.55)}
.node-safe{border-color:rgba(21,128,61,.45)}
.pulse{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 6px rgba(220,38,38,.14)}
.portal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.portal-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;text-align:left;box-shadow:var(--shadow2);display:flex;flex-direction:column;gap:14px;min-height:188px;transition:transform .16s ease,border .16s ease,box-shadow .16s ease}
.portal-card:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:var(--shadow)}
.portal-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.portal-icon{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;background:var(--surface3);color:var(--brand)}
.portal-card h2{font-size:18px;margin:0}
.portal-card p{font-size:13px;line-height:1.55;color:var(--muted);margin:0;flex:1}
.feature-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.feature-list li{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}
.check-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}
.source-note{max-width:1180px;margin:0 auto 28px;padding:0 24px;color:var(--subtle);font-size:12px;line-height:1.6}
.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr;background:var(--bg)}
.sidebar{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30}
.side-head{padding:18px 16px;border-bottom:1px solid var(--border)}
.role-chip{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 9px;border-radius:8px;background:var(--surface3);color:var(--muted);font-size:12px;font-weight:800}
.side-nav{padding:12px;display:grid;gap:5px;overflow:auto}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:8px;color:var(--muted);font-weight:700;font-size:13px;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(15,118,110,.12);color:var(--brand)}
[data-mode="dark"] .nav-item.active{background:rgba(45,212,191,.13)}
.side-foot{margin-top:auto;padding:14px 12px;border-top:1px solid var(--border);display:grid;gap:8px}
.content{min-width:0}
.content-top{height:64px;background:rgba(244,247,251,.86);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:25;backdrop-filter:blur(18px)}
[data-mode="dark"] .content-top{background:rgba(11,13,15,.88)}
.page{padding:24px;max-width:1440px;margin:0 auto}
.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}
.page-title h1{font-size:26px;line-height:1.2;margin:0;font-weight:800}
.page-title p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.55}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow2);overflow:hidden}
.panel-pad{padding:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid var(--border)}
.panel-title{font-weight:800;font-size:14px}
.panel-sub{color:var(--muted);font-size:12px;margin-top:3px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;box-shadow:var(--shadow2)}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.stat-icon{width:34px;height:34px;border-radius:8px;background:var(--surface3);display:grid;place-items:center;color:var(--brand)}
.stat-value{font-size:25px;font-weight:800;line-height:1}
.stat-label{color:var(--muted);font-size:12px;font-weight:700;margin-top:6px}
.stat-trend{font-size:12px;font-weight:800}
.trend-good{color:var(--green)}
.trend-watch{color:var(--amber)}
.trend-risk{color:var(--red)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border:1px solid transparent}
.badge-green{color:var(--green);background:rgba(21,128,61,.10);border-color:rgba(21,128,61,.22)}
.badge-amber{color:var(--amber);background:rgba(180,83,9,.10);border-color:rgba(180,83,9,.22)}
.badge-red{color:var(--red);background:rgba(220,38,38,.10);border-color:rgba(220,38,38,.22)}
.badge-blue{color:var(--blue);background:rgba(37,99,235,.10);border-color:rgba(37,99,235,.20)}
.badge-muted{color:var(--muted);background:var(--surface3);border-color:var(--border)}
.row-list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row-main{min-width:0;flex:1}
.row-title{font-weight:800;font-size:13px;margin-bottom:4px}
.row-sub{font-size:12px;color:var(--muted);line-height:1.45}
.avatar{width:38px;height:38px;border-radius:8px;background:var(--surface3);display:grid;place-items:center;color:var(--brand);font-size:12px;font-weight:800;flex:0 0 auto}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;border-bottom:1px solid var(--border);padding:12px 14px;font-size:13px;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);font-weight:800}
tr:last-child td{border-bottom:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field-full{grid-column:1/-1}
.switch-line{display:flex;align-items:center;gap:10px}
.switch{width:42px;height:24px;border-radius:999px;background:var(--surface3);border:1px solid var(--border2);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;background:var(--subtle);transition:left .16s ease,background .16s ease}
.switch.on{background:rgba(15,118,110,.16);border-color:var(--brand)}
.switch.on::after{left:20px;background:var(--brand)}
.incident-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:15px;display:grid;gap:12px;box-shadow:var(--shadow2)}
.incident-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.incident-id{font-size:12px;font-weight:800;color:var(--muted)}
.incident-title{font-size:15px;font-weight:800;margin-top:4px}
.incident-meta{display:flex;gap:8px;flex-wrap:wrap}
.timeline{position:relative;display:grid;gap:12px}
.timeline-item{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start}
.timeline-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--brand)}
.progress{height:8px;background:var(--surface3);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--brand);border-radius:999px}
.risk-meter{height:10px;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));border-radius:999px;position:relative}
.risk-meter::after{content:"";position:absolute;top:-4px;width:4px;height:18px;border-radius:99px;background:var(--text);left:var(--pos,50%)}
.chart{height:220px;display:flex;align-items:end;gap:10px;padding:18px 14px 12px;border-top:1px solid var(--border)}
.bar{flex:1;min-width:20px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--brand),var(--blue));position:relative}
.bar span{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:800}
.bar-labels{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:0 14px 14px;color:var(--muted);font-size:11px;font-weight:800;text-align:center}
.bar-labels span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel.map-large{min-height:520px;display:flex;flex-direction:column}
.map-large .venue-map{flex:1;min-height:360px;border-left:0;border-right:0;border-bottom:0;border-radius:0}
.resource-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.resource-card{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:14px;display:grid;gap:10px}
.mobile-nav{display:none}
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:100;display:grid;gap:10px;width:min(360px,calc(100vw - 36px))}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);box-shadow:var(--shadow);border-radius:8px;padding:12px 14px;animation:toast-in .18s ease both}
.toast strong{display:block;font-size:13px;margin-bottom:3px}
.toast span{font-size:12px;color:var(--muted);line-height:1.4}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1080px){
  .landing-main{grid-template-columns:1fr}
  .portal-grid,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .content-top{top:0}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--surface);border-top:1px solid var(--border);z-index:50;overflow:auto}
  .mobile-nav .nav-item{min-width:88px;justify-content:center;flex-direction:column;gap:4px;border-radius:0;padding:7px 8px;font-size:10px}
  .page{padding:20px 16px 84px}
}
@media(max-width:720px){
  .topbar,.content-top{padding:0 14px}
  .brand-title span:last-child{display:none}
  .landing-main{padding:28px 14px 36px}
  .hero h1{font-size:33px}
  .proof-grid,.portal-grid,.grid-2,.grid-3,.grid-4,.resource-grid,.form-grid{grid-template-columns:1fr}
  .page-title{flex-direction:column}
  .toolbar{width:100%}
  .toolbar .btn{flex:1}
  .field-full{grid-column:auto}
  .panel.map-large{min-height:420px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toastWrap" class="toast-wrap"></div>
<script>
const icons={
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  radio:'<path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2a6 6 0 0 1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.5"/><path d="M19.1 4.9c3.9 3.9 3.9 10.2 0 14.1"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"/><path d="M9 3v15"/><path d="M15 6v15"/>',
  chart:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',
  clipboard:'<path d="M9 5h6"/><path d="M9 12h6"/><path d="M9 17h4"/><path d="M8 3h8l1 2h3v16H4V5h3l1-2z"/>',
  settings:'<path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1z"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/>',
  logOut:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',

function statusBadge(value){
  const v=String(value).toLowerCase();
  const cls=v.includes('critical')||v.includes('high')||v.includes('overdue')?'badge-red':v.includes('medium')||v.includes('watch')||v.includes('triage')||v.includes('assigned')||v.includes('responding')||v.includes('progress')?'badge-amber':v.includes('low')||v.includes('closed')||v.includes('normal')||v.includes('open')||v.includes('available')||v.includes('active')||v.includes('ready')||v.includes('verified')?'badge-green':'badge-muted';
  return `<span class="badge ${cls}">${value}</span>`;
}
function sevBadge(sev){
  const map={critical:'badge-red',high:'badge-red',medium:'badge-amber',low:'badge-green'};
  return `<span class="badge ${map[String(sev).toLowerCase()]||'badge-muted'}">${sev}</span>`;
}
function toast(title,msg,type='info'){
  const wrap=document.getElementById('toastWrap');
  const border=type==='danger'?'var(--red)':type==='success'?'var(--green)':type==='warn'?'var(--amber)':'var(--brand)';
  const node=document.createElement('div');
  node.className='toast';
  node.style.borderLeftColor=border;
  node.innerHTML=`<strong>${title}</strong><span>${msg}</span>`;
  wrap.appendChild(node);
  setTimeout(()=>node.remove(),4200);
}

      <div class="panel-head"><div><div class="panel-title">Compose alert</div><div class="panel-sub">Use short, specific instructions with audience and channel controls</div></div>${statusBadge('Approval required')}</div>
      <div class="panel-pad form-grid">
        <div><label for="ad-sev">Severity</label><select id="ad-sev"><option>low</option><option>medium</option><option selected>high</option><option>critical</option></select></div>
        <div><label for="ad-audience">Audience</label><select id="ad-audience"><option>All users and staff</option><option>Main Stage only</option><option>Staff only</option><option>Gate C ticket holders</option><option>Medical and security leads</option></select></div>
        <div><label for="ad-channel">Channels</label><select id="ad-channel"><option>App, SMS, PA</option><option>App only</option><option>App and SMS</option><option>Staff radio and app</option><option>Email summary</option></select></div>
        <div><label for="ad-zone">Related zone</label><select id="ad-zone"><option>All zones</option>${state.zones.map(z=>`<option>${z.name}</option>`).join('')}</select></div>
        <div class="field-full"><label for="ad-title">Title</label><input id="ad-title" value="Use East Concourse for Main Stage movement"/></div>
        <div class="field-full"><label for="ad-msg">Instruction</label><textarea id="ad-msg">Main Stage is at high density. Use East Concourse and follow staff instructions until the next update.</textarea></div>
        <div class="field-full toolbar"><button class="btn btn-primary" onclick="sendAdminAlert()">${I('send')} Send alert</button><button class="btn btn-outline" onclick="toast('Template loaded','Evacuation guidance template is ready.','success')">${I('file')} Load template</button></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><div class="panel-title">Alert history</div><div class="panel-sub">Delivery, channels, and acknowledgement state</div></div></div>
      <div class="row-list">${state.alerts.map(a=>alertSummary(a,false)).join('')}</div>
    </section>
  </div>`;
}
function adminCompliancePage(){
  return `${pageTitle('Compliance and audit','Evidence trail for reports, broadcasts, assignments, inspections, and post-event review.',`<button class="btn btn-primary" onclick="exportBriefing()">${I('file')} Export audit pack</button>`)}
  <div class="grid grid-3">
    ${stat('Audit entries',state.audit.length,'Immutable event trail in production','file','trend-good')}
    ${stat('Inspection completion','78%','Two checks due this hour','clipboard','trend-watch')}
    ${stat('Policy exceptions','1','Medical privacy backup contact missing','lock','trend-watch')}
  </div>
  <section class="panel" style="margin-top:16px;">
    <div class="panel-head"><div><div class="panel-title">Audit trail</div><div class="panel-sub">System, user, staff, and admin actions</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Type</th><th>Action</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td>${a.time}</td><td>${a.actor}</td><td>${statusBadge(a.type)}</td><td>${a.action}</td></tr>`).join('')}</tbody></table></div>
  </section>
  <section class="panel" style="margin-top:16px;">
    <div class="panel-head"><div><div class="panel-title">Inspection controls</div><div class="panel-sub">Readiness checks aligned to operational risk</div></div></div>
    <div class="row-list">${state.checklists.map(c=>`<div class="row"><div class="avatar">${I('clipboard')}</div><div class="row-main"><div class="row-title">${c.name}</div><div class="row-sub">${c.owner} - Due ${c.due}</div><div class="progress" style="margin-top:8px;"><span style="width:${c.progress}%"></span></div></div>${statusBadge(c.status)}</div>`).join('')}</div>
  </section>`;
}
function adminSettingsPage(){
  return `${pageTitle('System settings','Operational thresholds, privacy policy, integrations, and role controls for the demo environment.',`<button class="btn btn-primary" onclick="toast('Settings saved','SafeFlow policy configuration was updated.','success')">${I('check')} Save settings</button>`)}
  <div class="grid grid-2">
    <section class="panel">
      <div class="panel-head"><div><div class="panel-title">Risk thresholds</div><div class="panel-sub">Automated watches and escalation triggers</div></div></div>
      <div class="panel-pad grid">
        <div><div class="strong">Capacity alert threshold: <span id="capValue">${state.settings.capacityThreshold}%</span></div><input type="range" min="60" max="98" value="${state.settings.capacityThreshold}" oninput="state.settings.capacityThreshold=this.value;document.getElementById('capValue').textContent=this.value+'%';"/></div>
        ${settingSwitch('autoEscalate','Auto escalation','Escalate critical incidents to command after SLA breach')}
        ${settingSwitch('anonymous','Anonymous reporting','Allow users to report with identity hidden from field staff')}
        ${settingSwitch('medicalPrivacy','Medical privacy guardrails','Restrict sensitive medical detail to authorized roles')}
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><div class="panel-title">Communication channels</div><div class="panel-sub">Used for alert delivery and acknowledgement</div></div></div>
      <div class="panel-pad grid">
        ${settingSwitch('sms','SMS delivery','Send urgent notices by SMS when available')}
        ${settingSwitch('email','Email summaries','Send non-critical summaries by email')}
        ${settingSwitch('pa','PA integration','Allow admin-approved PA announcement requests')}
      </div>
    </section>
  </div>
  <section class="panel" style="margin-top:16px;">
    <div class="panel-head"><div><div class="panel-title">Role permissions</div><div class="panel-sub">Separation of duties for user, staff, and admin workflows</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Permission</th><th>User</th><th>Staff</th><th>Admin</th></tr></thead><tbody>
      <tr><td>Submit incident report</td><td>${statusBadge('Allowed')}</td><td>${statusBadge('Allowed')}</td><td>${statusBadge('Allowed')}</td></tr>
      <tr><td>View targeted alerts</td><td>${statusBadge('Allowed')}</td><td>${statusBadge('Allowed')}</td><td>${statusBadge('Allowed')}</td></tr>
      <tr><td>Assign incident owner</td><td>${statusBadge('Blocked')}</td><td>${statusBadge('Limited')}</td><td>${statusBadge('Allowed')}</td></tr>
      <tr><td>Send mass broadcast</td><td>${statusBadge('Blocked')}</td><td>${statusBadge('Review')}</td><td>${statusBadge('Allowed')}</td></tr>
      <tr><td>Export audit pack</td><td>${statusBadge('Blocked')}</td><td>${statusBadge('Blocked')}</td><td>${statusBadge('Allowed')}</td></tr>
    </tbody></table></div>
  </section>`;
}

function stat(label,value,sub,icon,trendClass){
  return `<div class="stat"><div class="stat-top"><div class="stat-icon">${I(icon)}</div><span class="stat-trend ${trendClass||''}">${value}</span></div><div class="stat-value mono">${value}</div><div class="stat-label">${label}</div><div class="row-sub" style="margin-top:8px;">${sub}</div></div>`;
}
function alertSummary(a,compact){
  const ack=`<div class="progress" style="margin-top:9px;"><span style="width:${a.ack}%"></span></div><div class="row-sub" style="margin-top:6px;">${a.ack}% acknowledged - ${a.channel}</div>`;
  return `<div class="${compact?'incident-card':'row'}">
    ${compact?`<div class="incident-top"><div><div class="incident-id">${a.id} - ${a.time}</div><div class="incident-title">${a.title}</div></div>${sevBadge(a.severity)}</div><div class="row-sub">${a.message}</div><div class="incident-meta">${statusBadge(a.zone)}${statusBadge(a.audience)}</div>${ack}<div class="toolbar"><button class="btn btn-primary btn-sm" onclick="ackAlert('${a.id}')">${I('check')} Acknowledge</button><button class="btn btn-outline btn-sm" onclick="toast('Guidance opened','Detailed safety guidance is available in the resources view.','success')">${I('file')} Details</button></div>`:
    `<div class="avatar">${I('bell')}</div><div class="row-main"><div class="row-title">${a.title}</div><div class="row-sub">${a.id} - ${a.zone} - ${a.message}</div>${ack}</div><div class="toolbar">${sevBadge(a.severity)}<button class="btn btn-ghost btn-sm" onclick="ackAlert('${a.id}')">${I('check')} Ack</button></div>`}
  </div>`;
}
function reportRow(r){
  return `<div class="row"><div class="avatar">${I('file')}</div><div class="row-main"><div class="row-title">${r.id} - ${r.type}</div><div class="row-sub">${r.summary} - ${r.time}</div></div>${statusBadge(r.status)}</div>`;
}
function incidentRow(i){
  return `<div class="row"><div class="avatar">${I('alert')}</div><div class="row-main"><div class="row-title">${i.id} - ${i.type}</div><div class="row-sub">${i.zone} - ${i.location} - Owner: ${i.owner}</div></div><div class="toolbar">${sevBadge(i.severity)}${statusBadge(i.status)}</div></div>`;
}
function incidentActionRow(i,role){
  return `<div class="row"><div class="avatar">${I('alert')}</div><div class="row-main"><div class="row-title">${i.id} - ${i.type}</div><div class="row-sub">${i.description}</div><div class="incident-meta" style="margin-top:8px;">${sevBadge(i.severity)}${statusBadge(i.status)}${statusBadge(i.zone)}<span class="badge badge-muted">Owner: ${i.owner}</span></div></div><button class="btn btn-ghost btn-sm" onclick="advanceIncident('${i.id}')">${I('check')} ${role==='admin'?'Advance':'Update'}</button></div>`;
}
function zoneRow(z){
  return `<div class="row"><div class="avatar">${I('map')}</div><div class="row-main"><div class="row-title">${z.name}</div><div class="row-sub">${z.density}% density - ${z.staff} staff - ${z.response} response</div><div class="progress" style="margin-top:8px;"><span style="width:${z.density}%"></span></div></div>${statusBadge(riskFromDensity(z.density))}</div>`;
}
function resourceMini(title,sub,status,icon){
  return `<div class="resource-card"><div class="stat-icon">${I(icon)}</div><div><div class="row-title">${title}</div><div class="row-sub">${sub}</div></div>${statusBadge(status)}</div>`;
}
function resourceCard(r){
  return `<div class="resource-card"><div class="incident-top"><div><div class="row-title">${r.name}</div><div class="row-sub">${r.type} - ${r.zone}</div></div>${statusBadge(r.status)}</div><div class="progress"><span style="width:${r.stock}%"></span></div><div class="row-sub">Readiness ${r.stock}% - ETA ${r.eta}</div></div>`;
}
function contactRow(name,num,sub){
  return `<div class="row"><div class="avatar">${I('activity')}</div><div class="row-main"><div class="row-title">${name}</div><div class="row-sub">${sub}</div></div><a class="btn btn-ghost btn-sm" href="tel:${num}">${num}</a></div>`;
}
function noteRow(time,msg){
  return `<div class="row"><div class="avatar">${String(time).slice(0,2).toUpperCase()}</div><div class="row-main"><div class="row-title">${time}</div><div class="row-sub">${msg}</div></div></div>`;
}
function staffRow(s){
  return `<div class="row"><div class="avatar">${initials(s.name)}</div><div class="row-main"><div class="row-title">${s.name}</div><div class="row-sub">${s.role} - ${s.zone} - Last update ${s.last}</div></div><div class="toolbar">${statusBadge(s.status)}${statusBadge(s.load)}</div></div>`;
}
function actionRow(title,sub,icon,type){
  const fn=type==='danger'?'triggerCriticalAlert()':`toast('${title}','Command action recorded and added to the audit log.','success')`;
  return `<div class="row"><div class="avatar">${I(icon)}</div><div class="row-main"><div class="row-title">${title}</div><div class="row-sub">${sub}</div></div><button class="btn ${type==='danger'?'btn-danger':type==='warn'?'btn-warning':'btn-ghost'} btn-sm" onclick="${fn}">${I('check')} Execute</button></div>`;
}
function scanRow(time,rfid,name,result,risk){
  return `<div class="row"><div class="avatar">${I('scan')}</div><div class="row-main"><div class="row-title">${rfid} - ${name}</div><div class="row-sub">${time} - ${result}</div></div>${statusBadge(risk)}</div>`;
}
function timelineItem(step,text){
  return `<div class="timeline-item"><div class="timeline-dot"></div><div><div class="row-title">Step ${step}</div><div class="row-sub">${text}</div></div></div>`;
}
function settingSwitch(key,title,desc){
  return `<div class="switch-line"><button class="switch ${state.settings[key]?'on':''}" onclick="state.settings.${key}=!state.settings.${key};render()" aria-label="Toggle ${title}"></button><div><div class="strong">${title}</div><div class="row-sub">${desc}</div></div></div>`;
}
function currentTime(){
  return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
}
function ackAlert(id){
  const a=state.alerts.find(x=>x.id===id);
  if(a){a.read=true;a.ack=Math.min(100,a.ack+8);toast('Alert acknowledged',`${a.id} acknowledgement recorded.`,'success');render();}
}
function ackAllAlerts(){
  state.alerts.forEach(a=>{a.read=true;a.ack=Math.max(a.ack,96);});
  toast('Alerts acknowledged','All current safety notices are marked acknowledged.','success');
  render();
}
function advanceIncident(id){
  const i=state.incidents.find(x=>x.id===id);
  if(!i)return;
  const flow=['Triage','Assigned','Responding','Monitoring','Closed'];
  const next=flow[Math.min(flow.indexOf(i.status)+1,flow.length-1)]||'Assigned';
  i.status=next;
  if(next==='Closed')i.sla='Closed';
  state.audit.unshift({time:currentTime(),actor:state.role==='admin'?'Admin':state.staffUser.name,action:`Advanced ${id} to ${next}`,type:'Incident'});
  toast('Incident updated',`${id} moved to ${next}.`,'success');
  render();
}
function sendAdminAlert(){
  const title=escapeHtml(document.getElementById('ad-title')?.value||'Safety alert');
  const message=escapeHtml(document.getElementById('ad-msg')?.value||'Follow staff instructions.');
  const severity=document.getElementById('ad-sev')?.value||'medium';
  const audience=document.getElementById('ad-audience')?.value||'All users and staff';
  const channel=document.getElementById('ad-channel')?.value||'App';
  const zone=document.getElementById('ad-zone')?.value||'All zones';
  const id=`ALT-${1050+state.alerts.length}`;
  state.alerts.unshift({id,severity,title,audience,zone,time:currentTime(),message,ack:0,read:false,channel});
  state.audit.unshift({time:currentTime(),actor:'Admin',action:`Sent alert ${id} to ${audience}`,type:'Alert'});
  toast('Alert sent',`${id} delivered through ${channel}.`,severity==='critical'?'danger':'success');
  render();
}
function submitStaffBroadcast(){
  const msg=escapeHtml(document.getElementById('ba-msg')?.value||'Broadcast request submitted.');
  state.audit.unshift({time:currentTime(),actor:state.staffUser.name,action:`Requested broadcast: ${msg.slice(0,70)}`,type:'Alert'});
  toast('Broadcast request submitted','Command can approve and send it from the admin alert center.','success');
}
function triggerCriticalAlert(){
  const id=`ALT-${1050+state.alerts.length}`;
  state.alerts.unshift({id,severity:'critical',title:'Emergency action required',audience:'All users and staff',zone:'All zones',time:currentTime(),message:'Follow staff instructions, move calmly to marked exits, and avoid high-density routes.',ack:0,read:false,channel:'App, SMS, PA'});
  state.audit.unshift({time:currentTime(),actor:'Admin',action:`Triggered emergency alert ${id}`,type:'Alert'});
  toast('Emergency alert triggered',`${id} was sent to all users and staff.`, 'danger');
  render();
}
function exportBriefing(){
  toast('Briefing generated','A professional summary is ready in the audit and analytics views.','success');
}
function completeNextChecklist(){
  const c=state.checklists.find(x=>x.progress<100);
  if(c){c.progress=Math.min(100,c.progress+14);c.status=c.progress>=100?'Completed':'In progress';toast('Checklist updated',`${c.id} is now ${c.progress}% complete.`,'success');render();}
}
function lookupScan(){
  const q=document.getElementById('scanInput')?.value.toLowerCase()||'';
  const a=state.attendees.find(x=>x.rfid.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));
  const out=document.getElementById('scanResult');
  if(!out)return;
  out.innerHTML=a?`<div class="incident-card"><div class="incident-top"><div><div class="incident-id">${a.rfid}</div><div class="incident-title">${a.name}</div></div>${statusBadge(a.risk)}</div><div class="row-sub">${a.zone} - ${a.status} - Contact ${a.contact}</div><div class="toolbar"><button class="btn btn-success btn-sm" onclick="toast('Access approved','${a.name} access event recorded.','success')">${I('check')} Approve</button><button class="btn btn-warning btn-sm" onclick="toast('Manual review','Command review requested for ${a.rfid}.','warn')">${I('alert')} Review</button></div></div>`:`<div class="incident-card"><div class="incident-title">No matching record</div><div class="row-sub">Manual identity check required before access is granted.</div></div>`;
}
function simulateScan(){
  const a=state.attendees[Math.floor(Math.random()*state.attendees.length)];
  const input=document.getElementById('scanInput');
  if(input)input.value=a.rfid;
  const feed=document.getElementById('scanFeed');
  if(feed)feed.insertAdjacentHTML('afterbegin',scanRow(currentTime(),a.rfid,a.name,a.status==='Exited'?'Exit recorded':'Entry approved',a.risk));
  lookupScan();
  toast('Scan received',`${a.rfid} was processed at Gate B.`,'success');
}
function drawCharts(){
  const entry=document.getElementById('entryChart');
  const inc=document.getElementById('incidentChart');
  if(entry)entry.innerHTML=[38,55,61,74,96,82,69,46].map(v=>`<div class="bar" style="height:${v}%"><span>${v}</span></div>`).join('');
  if(inc)inc.innerHTML=[42,70,26,35,31,18,9,14].map(v=>`<div class="bar" style="height:${v}%"><span>${v}</span></div>`).join('');
}

render();
</script>
</body>
</html>
